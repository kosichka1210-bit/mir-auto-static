name: Publish MIR AUTO preview
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Telegram bot PHP syntax
        run: find telegram-bot -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Test forwarded-post field parsing
        run: php telegram-bot/tests/test-post-parser.php
      - name: Unpack site
        run: unzip -q timeweb-site.zip -d site
      - name: Connect protected Telegram contact form
        run: |
          node --check contact-form.js
          cp contact-form.js site/contact-form.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path('site/index.html')
          html = page.read_text(encoding='utf-8')
          marker = '<script src="contact-form.js?v=2" defer></script>'
          assert 'request-form' in html, 'Contact form missing in published archive'
          if marker not in html:
              assert '</body>' in html, 'Missing script insertion point'
              html = html.replace('</body>', marker + '\n</body>', 1)
          page.write_text(html, encoding='utf-8')
          PY
      - name: Add MIR AUTO SEO metadata and sitemap
        run: python3 tools/enrich_site_seo.py site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
